openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - cookieSession: []
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: lessons
    description: Beginner lesson content per language
  - name: lesson-completions
    description: Per-language lesson completion tracking
  - name: models
    description: Models available to answer with
paths:
  /auth/methods:
    get:
      security: []
      operationId: getSignInMethods
      tags: [auth]
      responses:
        "200":
          description: Available sign-in methods without exposing configuration values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
  /auth/email-code/request:
    post:
      security: []
      operationId: requestEmailCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds, resendAfterSeconds]
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  expiresInSeconds:
                    type: integer
                  resendAfterSeconds:
                    type: integer
        default:
          description: Invalid email (400), request rejected (403), rate limited (429), or delivery unavailable (503)
  /auth/email-code/verify:
    post:
      security: []
      operationId: verifyEmailCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeVerification"
      responses:
        "200":
          description: Signed in or new verified account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
        default:
          description: Invalid input (400), invalid/expired code (401), origin rejected (403), or rate limited (429)
  /auth/google/start:
    post:
      security: []
      operationId: startGoogleSignIn
      tags: [auth]
      responses:
        "200":
          description: Google authorization URL with server-managed state and PKCE
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        default:
          description: Origin rejected (403), rate limited (429), or Google is not configured (503)
  /auth/google/callback:
    get:
      security: []
      operationId: googleSignInCallback
      tags: [auth]
      responses:
        "302":
          description: Redirect to tutor on success or sign-in with a generic error
  /auth/register:
    post:
      security: []
      operationId: registerAccount
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        default:
          description: Invalid input (400), origin rejected (403), duplicate email (409), or too many attempts (429)
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
  /auth/login:
    post:
      security: []
      operationId: loginAccount
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        default:
          description: Invalid input (400), invalid credentials (401), origin rejected (403), or too many attempts (429)
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
  /auth/session:
    get:
      operationId: getAccountSession
      tags: [auth]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
        "401":
          description: No valid session
  /auth/logout:
    post:
      security: []
      operationId: logoutAccount
      tags: [auth]
      responses:
        "204":
          description: Session revoked
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    patch:
      operationId: updateOpenaiConversation
      tags: [openai]
      summary: Update a conversation (e.g. change its language)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: Models the tutor can answer with
      description: >-
        The free models currently served by the provider, refreshed from
        upstream. Free model slugs are retired and rate-limited without notice,
        so this list changes over time.
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
  /progress/today:
    get:
      operationId: getProgressToday
      tags: [progress]
      summary: Today's learning progress
      description: Returns the student's progress toward today's learning goal for a language.
      parameters:
        - name: language
          in: query
          required: false
          description: Language code to scope progress to. Defaults to the default language.
          schema:
            type: string
      responses:
        "200":
          description: Today's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyProgress"
  /progress/history:
    get:
      operationId: getProgressHistory
      tags: [progress]
      summary: Learning history for a language
      description: Returns cumulative learned-word progress and recent vocabulary for study suggestions.
      parameters:
        - name: language
          in: query
          required: false
          description: Language code to scope learning history to. Defaults to the default language.
          schema:
            type: string
      responses:
        "200":
          description: Cumulative learning history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningHistory"
  /lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      summary: List beginner lessons for a language
      description: Returns structured beginner lessons with vocabulary and phrases for the requested language.
      parameters:
        - name: language
          in: query
          required: false
          description: Language code to return lessons for. Defaults to the default language.
          schema:
            type: string
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
  /lesson-completions:
    get:
      operationId: listLessonCompletions
      tags: [lesson-completions]
      summary: List completed lesson slugs for a language
      description: Returns the slugs of lessons the learner has marked complete for the requested language.
      parameters:
        - name: language
          in: query
          required: false
          description: Language code to return completions for. Defaults to the default language.
          schema:
            type: string
      responses:
        "200":
          description: Lesson completion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletions"
    post:
      operationId: markLessonCompleted
      tags: [lesson-completions]
      summary: Mark a lesson as completed for a language
      description: Idempotently records that a lesson has been completed for the given language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCompletionInput"
      responses:
        "200":
          description: Updated lesson completion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletions"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /lesson-completions/{slug}:
    delete:
      operationId: unmarkLessonCompleted
      tags: [lesson-completions]
      summary: Unmark a completed lesson for a language
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Language code the completion belongs to. Defaults to the default language.
          schema:
            type: string
      responses:
        "200":
          description: Updated lesson completion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletions"
  /lessons/{slug}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get a single lesson by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Language code to return the lesson for. Defaults to the default language.
          schema:
            type: string
      responses:
        "200":
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: tutor_session
  schemas:
    SignInMethods:
      type: object
      required: [emailCode, google, password]
      properties:
        emailCode:
          type: boolean
        google:
          type: boolean
        password:
          type: boolean
    EmailCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    EmailCodeVerification:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Optional password to set after proving ownership of this email
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    AccountSession:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: integer
            email:
              type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        language:
          type: string
          description: Language code the learner is studying in this conversation
        level:
          type: string
          description: Expertise level this conversation is taught at
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - language
        - level
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        language:
          type: string
          description: Language code to study in this conversation
        level:
          type: string
          description: Expertise level to teach this conversation at
      required:
        - title
    OpenaiConversationUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        language:
          type: string
          description: New language code for this conversation
        level:
          type: string
          description: New expertise level for this conversation
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        model:
          type: string
          maxLength: 200
          description: >-
            Preferred model slug to answer with. Tried first; the server falls
            back to its own chain when this model is unavailable. Omit (or send
            "auto") to let the server choose.
      required:
        - content
    ModelOption:
      type: object
      properties:
        id:
          type: string
          description: Model slug to send back as OpenaiMessageInput.model
        name:
          type: string
          description: Human-readable model name
        contextLength:
          type: integer
          description: Context window in tokens
        recommended:
          type: boolean
          description: Verified to follow the tutor's teaching format well
        note:
          type: string
          description: Short caveat shown next to the model, when there is one
      required:
        - id
        - name
        - recommended
    ModelList:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelOption"
        autoOrder:
          type: array
          description: The slugs the server tries, in order, when set to auto
          items:
            type: string
        locked:
          type: boolean
          description: >-
            True when the server pins a model via the OPENROUTER_MODEL env var
            or is not using OpenRouter at all, so a choice has no effect.
      required:
        - models
        - autoOrder
        - locked
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        language:
          type: string
          description: Language code the learner is studying in this conversation
        level:
          type: string
          description: Expertise level this conversation is taught at
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - language
        - level
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DailyProgress:
      type: object
      properties:
        points:
          type: integer
          description: Weighted learning points accumulated today
        target:
          type: integer
          description: Points needed to reach today's goal
        percent:
          type: integer
          description: Progress toward the goal as a percentage (0-100)
        achieved:
          type: boolean
          description: Whether today's goal has been reached
        wordsLearned:
          type: integer
          description: Number of target-language words taught today (the daily goal unit)
        language:
          type: string
          description: Language code this progress is scoped to
      required:
        - points
        - target
        - percent
        - achieved
        - wordsLearned
        - language
    LearningReviewTerm:
      type: object
      properties:
        native:
          type: string
        transliteration:
          type: string
        english:
          type: string
      required:
        - native
        - transliteration
        - english
    LearningHistory:
      type: object
      properties:
        language:
          type: string
        hasHistory:
          type: boolean
        totalWords:
          type: integer
          description: Cumulative weighted count of taught words across all assistant replies in this language
        reviewTerms:
          type: array
          description: Recent distinct vocabulary items taught in this language
          items:
            $ref: "#/components/schemas/LearningReviewTerm"
      required:
        - language
        - hasHistory
        - totalWords
        - reviewTerms
    LessonPhrase:
      type: object
      properties:
        native:
          type: string
          description: The phrase written in the target language's native script
        transliteration:
          type: string
          description: Roman/English transliteration (may be empty for Latin scripts)
        english:
          type: string
          description: English meaning
      required:
        - native
        - transliteration
        - english
    LessonCompletions:
      type: object
      properties:
        language:
          type: string
          description: Language code these completions are scoped to
        completedSlugs:
          type: array
          description: Slugs of lessons that have been marked complete
          items:
            type: string
      required:
        - language
        - completedSlugs
    LessonCompletionInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 200
          description: Slug of the lesson to mark complete
        language:
          type: string
          description: Language code the lesson belongs to
      required:
        - slug
    Lesson:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        emoji:
          type: string
          description: A short label or icon hint for the lesson topic
        level:
          type: string
          description: Expertise level this lesson belongs to (beginner/intermediate/advanced)
        phrases:
          type: array
          items:
            $ref: "#/components/schemas/LessonPhrase"
      required:
        - slug
        - title
        - description
        - level
        - phrases
